        fill="#667eea" text-anchor="middle" dominant-baseline="middle">ZIP</text>

  <!-- Decorative lines at bottom representing mail/envelope -->
  <rect x="35" y="95" width="58" height="3" fill="white" rx="1.5"/>
  <rect x="40" y="102" width="48" height="3" fill="white" rx="1.5"/>
  <rect x="45" y="109" width="38" height="3" fill="white" rx="1.5"/>
</svg>

<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#667eea"/>

  <!-- Location pin shape -->
  <path d="M 64 20 C 50 20 39 31 39 45 C 39 63 64 85 64 85 C 64 85 89 63 89 45 C 89 31 78 20 64 20 Z"
        fill="white" stroke="#764ba2" stroke-width="2"/>

  <!-- Zip code text "ZIP" -->

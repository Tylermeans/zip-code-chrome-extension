<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Zip Code Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>US Zip Code Finder</h1>
      <p class="subtitle">Search 41,000+ zip codes</p>
    </header>

    <div class="search-section">
      <div class="tabs">
        <button class="tab-button active" data-tab="city-to-zip">City → Zip</button>
        <button class="tab-button" data-tab="zip-to-city">Zip → City</button>
      </div>

      <!-- City to Zip Search -->
      <div class="tab-content active" id="city-to-zip">
        <div class="search-box">
          <input
            type="text"
            id="city-input"
            placeholder="Enter city name (e.g., New York)"
            autocomplete="off"
          >
          <input
            type="text"
            id="state-input"
            placeholder="Enter state (e.g., NY or New York)"
            autocomplete="off"
          >
          <button id="city-search-btn" class="search-btn">Search</button>
        </div>
      </div>

      <!-- Zip to City Search -->
      <div class="tab-content" id="zip-to-city">
        <div class="search-box">
          <input
            type="text"
            id="zip-input"
            placeholder="Enter zip code (e.g., 10001)"
            maxlength="5"
            autocomplete="off"
          >
          <button id="zip-search-btn" class="search-btn">Search</button>
        </div>
      </div>
    </div>

    <div id="results-container">
      <div id="loading" class="hidden">
        <div class="loader"></div>
        <p>Searching...</p>
      </div>

      <div id="results"></div>

      <div id="no-results" class="hidden">
        <p>No results found. Please try again.</p>
      </div>
    </div>

    <footer>
      <p class="info-text">Data includes all US zip codes</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
